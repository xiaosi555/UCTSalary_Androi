name: Build UCTSalary Android APK

on:
  push:
    branches: [main]
    paths:
      - 'UCTSalary_Android.zip'
      - '.github/workflows/android-apk.yml'
      - 'README.md'
      - 'native-overrides/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Extract project and detect build versions
        shell: bash
        run: |
          set -euo pipefail
          test -f UCTSalary_Android.zip
          mkdir -p extracted
          unzip -q UCTSalary_Android.zip -d extracted
          SETTINGS_FILE="$(find extracted -type f -name 'settings.gradle.kts' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find extracted -type f -name 'settings.gradle' -print -quit)"
          fi
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle project settings file not found in archive"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          WRAPPER_PROPS="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$WRAPPER_PROPS" ]; then
            echo "::error::gradle-wrapper.properties is missing"
            exit 1
          fi
          DIST_URL="$(grep '^distributionUrl=' "$WRAPPER_PROPS" | cut -d= -f2-)"
          DIST_FILE="${DIST_URL##*/}"
          GRADLE_VERSION="${DIST_FILE#gradle-}"
          GRADLE_VERSION="${GRADLE_VERSION%-bin.zip}"
          GRADLE_VERSION="${GRADLE_VERSION%-all.zip}"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "::error::Could not determine Gradle version from $WRAPPER_PROPS"
            cat "$WRAPPER_PROPS"
            exit 1
          fi
          echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"
          echo "Gradle distribution: $DIST_URL"
          echo "Detected Gradle version: $GRADLE_VERSION"
          echo "---- Root build.gradle.kts ----"
          cat "$PROJECT_DIR/build.gradle.kts" 2>/dev/null || true
          echo "---- App build.gradle.kts ----"
          cat "$PROJECT_DIR/app/build.gradle.kts" 2>/dev/null || true
          echo "---- Gradle wrapper properties ----"
          cat "$WRAPPER_PROPS"
          HOME_SCREEN="$PROJECT_DIR/app/src/main/java/com/uct/salary/ui/screens/HomeScreen.kt"
          if [ -f "$HOME_SCREEN" ] && grep -q "^import androidx.compose.foundation.layout.matchParentSize$" "$HOME_SCREEN"; then
            sed -i "/^import androidx.compose.foundation.layout.matchParentSize$/d" "$HOME_SCREEN"
            echo "Removed invalid package-level matchParentSize import; BoxScope supplies this member extension"
          fi
          python3 "$GITHUB_WORKSPACE/native-overrides/apply_patches.py" "$PROJECT_DIR"
          echo "---- HomeScreen.kt imports after patch ----"
          sed -n "1,50p" "$HOME_SCREEN"
          echo "---- HomeScreen.kt first 50 lines after patch ----"
          nl -ba "$HOME_SCREEN" | sed -n "1,50p"

      - name: Prepare native source review bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-review
          cd "$PROJECT_DIR"
          find . -type f \( -name '*.kt' -o -name '*.java' -o -name '*.xml' -o -name '*.gradle' -o -name '*.gradle.kts' -o -name '*.properties' -o -name '*.pro' -o -name '*.json' \) -print | sort > "$GITHUB_WORKSPACE/source-review/FILE_INDEX.txt"
          while IFS= read -r file; do
            mkdir -p "$GITHUB_WORKSPACE/source-review/$(dirname "$file")"
            cp "$file" "$GITHUB_WORKSPACE/source-review/$file"
          done < "$GITHUB_WORKSPACE/source-review/FILE_INDEX.txt"
          cd "$GITHUB_WORKSPACE"
          zip -qr native-source-review.zip source-review

      - name: Set up project Gradle version
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run native calculation tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          APK_PATH="$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/*/*.apk" -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Gradle completed but no APK was found"
            find "$PROJECT_DIR" -type f -path "*/build/outputs/*" -print
            exit 1
          fi
          cp "$APK_PATH" apk-output/
          ls -lh apk-output
      - name: Commit patched Android source archive to main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/extracted"
          rm -f "$GITHUB_WORKSPACE/UCTSalary_Android.zip"
          zip -qr "$GITHUB_WORKSPACE/UCTSalary_Android.zip" UCTSalary
          cd "$GITHUB_WORKSPACE"
          if ! git diff --quiet -- UCTSalary_Android.zip; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add UCTSalary_Android.zip
            git commit -m "Apply HTML parity updates to Android source archive [skip ci]"
            git push origin HEAD:main
            echo "Patched Android source archive committed to main"
          else
            echo "Android source archive already contains the fix"
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UCTSalary-Android-debug-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native source review artifact
        uses: actions/upload-artifact@v4
        with:
          name: UCTSalary-native-source-review
          path: native-source-review.zip
          if-no-files-found: error
          retention-days: 7
