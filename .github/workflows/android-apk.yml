name: Build UCTSalary Android APK

on:
  push:
    branches: [main]
    paths:
      - 'UCTSalary_Android.zip'
      - '.github/workflows/android-apk.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Extract project and detect build versions
        shell: bash
        run: |
          set -euo pipefail
          test -f UCTSalary_Android.zip
          mkdir -p extracted
          unzip -q UCTSalary_Android.zip -d extracted

          SETTINGS_FILE="$(find extracted -type f -name 'settings.gradle.kts' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find extracted -type f -name 'settings.gradle' -print -quit)"
          fi
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle project settings file not found in archive"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          WRAPPER_PROPS="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$WRAPPER_PROPS" ]; then
            echo "::error::gradle-wrapper.properties is missing"
            exit 1
          fi
          DIST_URL="$(grep '^distributionUrl=' "$WRAPPER_PROPS" | cut -d= -f2- | sed 's/\\\\:/:/g')"
          DIST_FILE="${DIST_URL##*/}"
          GRADLE_VERSION="${DIST_FILE#gradle-}"
          GRADLE_VERSION="${GRADLE_VERSION%-bin.zip}"
          GRADLE_VERSION="${GRADLE_VERSION%-all.zip}"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "::error::Could not determine Gradle version from $WRAPPER_PROPS"
            cat "$WRAPPER_PROPS"
            exit 1
          fi
          echo "GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"

          echo "Project root: $PROJECT_DIR"
          echo "Wrapper distribution: $DIST_URL"
          echo "Detected Gradle version: $GRADLE_VERSION"
          echo "---- Root build.gradle.kts ----"
          cat "$PROJECT_DIR/build.gradle.kts" 2>/dev/null || true
          echo "---- App build.gradle.kts ----"
          cat "$PROJECT_DIR/app/build.gradle.kts" 2>/dev/null || true
          echo "---- Gradle wrapper properties ----"
          cat "$WRAPPER_PROPS"

          HOME_SCREEN="$PROJECT_DIR/app/src/main/java/com/uct/salary/ui/screens/HomeScreen.kt"
          if grep -q "matchParentSize" "$HOME_SCREEN" && ! grep -q "import androidx.compose.foundation.layout.matchParentSize" "$HOME_SCREEN"; then
            sed -i "/^package /a import androidx.compose.foundation.layout.matchParentSize" "$HOME_SCREEN"
            echo "Applied missing Compose matchParentSize import to HomeScreen.kt"
          fi
      - name: Set up project Gradle version
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -exec cp {} apk-output/ \;
          if [ -z "$(find apk-output -maxdepth 1 -name '*.apk' -print -quit)" ]; then
            echo "::error::Gradle completed but no APK was found"
            exit 1
          fi
          ls -lh apk-output

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UCTSalary-Android-debug-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
 "$HOME_SCREEN"; then
            sed -i '/^import androidx.compose.foundation.layout\./a import androidx.compose.foundation.layout.matchParentSize' "$HOME_SCREEN"
            echo "Applied missing Compose matchParentSize import to HomeScreen.kt"
          fi

      - name: Set up project Gradle version
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -exec cp {} apk-output/ \;
          if [ -z "$(find apk-output -maxdepth 1 -name '*.apk' -print -quit)" ]; then
            echo "::error::Gradle completed but no APK was found"
            exit 1
          fi
          ls -lh apk-output

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UCTSalary-Android-debug-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
